services:
  process-studio-frontend-ui-development:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_URL: http://localhost:3002/apps/igrp-process-studio
        NEXT_PUBLIC_BASE_PATH: /apps/igrp-process-studio
        NEXT_PUBLIC_ALLOWED_DOMAINS: localhost,127.0.0.1,igrp.cv
    image: process-studio-frontend-ui-development
    ports:
      - '3002:3000'
